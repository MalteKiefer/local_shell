"$schema" = 'https://starship.rs/config-schema.json'
palette = "catppuccin_mocha"
add_newline = true

format = """
[](red)\
$os\
$username\
[](bg:peach fg:red)\
$directory\
[](bg:yellow fg:peach)\
$git_branch\
$git_status\
[](fg:yellow bg:green)\
$c$rust$golang$nodejs$python$java$kotlin$docker_context$conda$pixi\
[](fg:green bg:sapphire)\
$cmd_duration\
[](fg:sapphire)\
$line_break$character"""

[os]
disabled = false
style = "bg:red fg:crust"
[os.symbols]
Macos = " "
Debian = " "

[username]
show_always = true
style_user = "bg:red fg:crust"
style_root = "bg:red fg:crust"
format = '[ $user ]($style)'

[directory]
style = "bg:peach fg:crust"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"
[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:yellow"
format = '[[ $symbol $branch ](fg:crust bg:yellow)]($style)'

[git_status]
style = "bg:yellow"
format = '[[($all_status$ahead_behind )](fg:crust bg:yellow)]($style)'

[nodejs]
symbol = ""
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'
[c]
symbol = " "
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'
[rust]
symbol = ""
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'
[golang]
symbol = ""
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'
[java]
symbol = " "
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'
[kotlin]
symbol = ""
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'
[python]
symbol = ""
format = '[[ $symbol( $version)( \($virtualenv\)) ](fg:crust bg:green)]($style)'
[conda]
symbol = "  "
format = '[[ $symbol$environment ](fg:crust bg:green)]($style)'
ignore_base = true
[pixi]
symbol = "󰏗 "
format = '[[ $symbol($environment) ](fg:crust bg:green)]($style)'
[docker_context]
symbol = ""
format = '[[ $symbol( $context) ](fg:crust bg:green)]($style)'

[cmd_duration]
min_time = 2000
format = '[[  $duration ](fg:crust bg:sapphire)]($style)'

[line_break]
disabled = false

[character]
success_symbol = '[❯](bold fg:green)'
error_symbol = '[❯](bold fg:red)'
vimcmd_symbol = '[❮](bold fg:green)'

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"
